<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Web Components - Best Practices</title>
</head>
<body>
  <mc-grid></mc-grid>
  <script>
    class McGrid extends HTMLElement {
      connectedCallback() {
        const row = document.createElement('grid-row');
        const item = document.createElement('grid-item');
        const title = document.createElement('editable-title');
        title.setAttribute('value', 'something');
        item.appendChild(title);
        row.appendChild(item);
        this.appendChild(row);
      }
    }
    class GridRow extends HTMLElement {
    }
    class GridItem extends HTMLElement {
      connectedCallback() {
        this.setAttribute('tabindex', '0');
      }
      handleKeydown(e) {
        // debugger;
        switch (e.key) {
          case 'i':
            this.querySelector('editable-title')?.enterEditMode();
            e.preventDefault();
            break;
        }
      }
    }
    class EditableTitle extends HTMLElement {
      static get observedAttributes() {
        return ['value'];
      }
      constructor() {
        super();
        this._beforeValue = '';
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.innerHTML = `
          <style>
            .title {
              min-height: 1.2em;
              padding: 2px 4px;
            }
            .title:focus {
              outline: 2px solid #0066cc;
              background: #f0f8ff;
            }
          </style>
          <div class="title" part="title"></div>
        `;
        this._titleEl = this.shadowRoot.querySelector('.title');
      }
      attributeChangedCallback(name, oldValue, newValue) {
        if (name === 'value' && this._titleEl) {
          this._titleEl.textContent = newValue ?? '';
        }
      }
      get value() {
        return this.getAttribute('value') ?? '';
      }
      set value(val) {
        this.setAttribute('value', val);
      }
      enterEditMode() {
        this._beforeValue = this._titleEl.textContent;
        this._titleEl.setAttribute('contenteditable', 'true');
        this._titleEl.focus();
        const range = document.createRange();
        range.selectNodeContents(this._titleEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      exitEditMode(restore = false) {
        if (restore) {
          this._titleEl.textContent = this._beforeValue;
        } else {
          this.setAttribute('value', this._titleEl.textContent);
        }
        this._titleEl.setAttribute('contenteditable', 'false');
        this.closest('grid-item')?.focus();
      }
      handleKeydown(e) {
        // e.stopPropagation();
        switch (e.key) {
          case 'Escape':
            this.exitEditMode(true);
            break;
          case 'Enter':
            this.exitEditMode(false);
            break;
        }
      }
    }
    customElements.define('mc-grid', McGrid);
    customElements.define('grid-row', GridRow);
    customElements.define('grid-item', GridItem);
    customElements.define('editable-title', EditableTitle);
    document.addEventListener('keydown', (e) => {
      const el = e.target;
      switch (el.tagName) {
        case 'EDITABLE-TITLE':
        case 'GRID-ITEM':
          el.handleKeydown(e);
          break;
        default:
          break;
      }
    });
    document.querySelector('grid-item')?.focus();
  </script>
</body>
</html>
