<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandala Chart</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafafa;
      padding: 5px;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      width: 900px;
      height: 900px;
      background: #ccc;
      border: 2px solid #666;
      gap: 1px;
    }

    /* Thicker borders for 3x3 subgrid separation */
    .grid cell-test {
      border-right: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
    }

    /* Right border after columns 3 and 6 */
    .grid cell-test:nth-child(9n+3),
    .grid cell-test:nth-child(9n+6) {
      border-right: 2px solid #666;
    }

    /* Bottom border after rows 3 and 6 */
    .grid cell-test:nth-child(n+19):nth-child(-n+27),
    .grid cell-test:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 2px solid #666;
    }

    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 12px;
      line-height: 1.6;
    }

    .hint kbd {
      background: #eee;
      padding: 2px 5px;
      border-radius: 3px;
      border: 1px solid #ccc;
      font-family: monospace;
    }

    .toolbar {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .toolbar button {
      padding: 4px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .toolbar button:hover {
      background: #f5f5f5;
    }

    .toolbar input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>
  <div class="grid"></div>
  <modal-test></modal-test>
  <notify-test></notify-test>

  <div class="toolbar">
    <button id="btn-export">Export</button>
    <button id="btn-import">Import</button>
    <input type="file" id="file-input" accept=".md,.txt">
  </div>

  <div class="hint">
    <kbd>u</kbd> create |
    <kbd>i</kbd> inline edit |
    <kbd>o</kbd> detail edit |
    <kbd>Del</kbd> delete |
    <kbd>,.</kbd> in-cell nav |
    <kbd>m</kbd> unfocus dr |
    <kbd>hjkl</kbd> cell walk |
    <kbd>wersdfxcv</kbd> local jump |
    <kbd>WERSDFXCV</kbd> global jump
  </div>

  <script type="module">
    import { CellTest } from './components/cell-test.js';
    import { ModalTest } from './components/modal-test.js';
    import { NotifyTest } from './components/notify-test.js';

    // Create 81 cells in a 9x9 grid
    const grid = document.querySelector('.grid');
    for (let i = 0; i < 81; i++) {
      const cell = document.createElement('cell-test');
      cell.dataset.index = i;
      grid.appendChild(cell);
    }

    const modal = document.querySelector('modal-test');
    const notify = document.querySelector('notify-test');

    // Set shared modal and notify instances
    CellTest.setModal(modal);
    CellTest.setNotify(notify);

    // Position conversion helpers (needed early for SYNC_MAP)
    function positionToIndex(mg_row, mg_col, sg_row, sg_col) {
      const row = mg_row * 3 + sg_row;
      const col = mg_col * 3 + sg_col;
      return row * 9 + col;
    }

    function indexToPosition(index) {
      const row = Math.floor(index / 9);
      const col = index % 9;
      return {
        mg_row: Math.floor(row / 3),
        mg_col: Math.floor(col / 3),
        sg_row: row % 3,
        sg_col: col % 3
      };
    }

    const STORAGE_KEY = 'mandala-data';

    // localStorage persistence
    function saveToStorage() {
      const cells = document.querySelectorAll('cell-test');
      const data = Array.from(cells).map(cell => cell.data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadFromStorage() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return;
      try {
        const data = JSON.parse(stored);
        const cells = document.querySelectorAll('cell-test');
        data.forEach((cellData, i) => {
          if (cells[i]) cells[i].setData(cellData);
        });
      } catch (e) {
        console.error('Failed to load from storage:', e);
      }
    }

    // Listen for cell changes
    grid.addEventListener('cell-change', (e) => {
      syncCellData(e.target);
      saveToStorage();
    });

    // Load data on startup
    loadFromStorage();

    // Build sync map for lvl1 paired cells
    // mg[1,1];sg[x,y] <-> mg[x,y];sg[1,1]
    const SYNC_MAP = new Map();
    const LVL1_SG_POSITIONS_SYNC = [
      [0, 0], [0, 1], [0, 2],
      [1, 0],         [1, 2],
      [2, 0], [2, 1], [2, 2]
    ];
    const LVL1_MG_POSITIONS_SYNC = [
      [0, 0], [0, 1], [0, 2],
      [1, 0],         [1, 2],
      [2, 0], [2, 1], [2, 2]
    ];
    for (let i = 0; i < 8; i++) {
      const [sg_row, sg_col] = LVL1_SG_POSITIONS_SYNC[i];
      const [mg_row, mg_col] = LVL1_MG_POSITIONS_SYNC[i];
      const centerIndex = positionToIndex(1, 1, sg_row, sg_col);
      const pairIndex = positionToIndex(mg_row, mg_col, 1, 1);
      SYNC_MAP.set(centerIndex, pairIndex);
      SYNC_MAP.set(pairIndex, centerIndex);
    }

    let isSyncing = false;
    function syncCellData(cell) {
      if (isSyncing) return;
      const index = parseInt(cell.dataset.index);
      const pairIndex = SYNC_MAP.get(index);
      if (pairIndex === undefined) return;

      const cells = document.querySelectorAll('cell-test');
      const pairCell = cells[pairIndex];
      if (!pairCell) return;

      // Deep clone data to avoid shared references
      const data = cell.data ? JSON.parse(JSON.stringify(cell.data)) : null;
      isSyncing = true;
      pairCell.setData(data);
      isSyncing = false;
    }

    // Import/Export
    const btnExport = document.getElementById('btn-export');
    const btnImport = document.getElementById('btn-import');
    const fileInput = document.getElementById('file-input');

    btnExport.addEventListener('click', exportData);
    btnImport.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) importData(file);
      fileInput.value = '';
    });

    const US = '\x1f'; // Unit separator

    // Lvl1 positions in center maincell (mg[1,1]), excluding center
    const LVL1_SG_POSITIONS = [
      [0, 0], [0, 1], [0, 2],
      [1, 0],         [1, 2],
      [2, 0], [2, 1], [2, 2]
    ];

    // Corresponding maincell positions for lvl1 items
    const LVL1_MG_POSITIONS = [
      [0, 0], [0, 1], [0, 2],
      [1, 0],         [1, 2],
      [2, 0], [2, 1], [2, 2]
    ];

    // Lvl2 positions within a maincell (excluding center)
    const LVL2_SG_POSITIONS = [
      [0, 0], [0, 1], [0, 2],
      [1, 0],         [1, 2],
      [2, 0], [2, 1], [2, 2]
    ];

    function formatLine(indent, isFolder, title, metadata, description) {
      const marker = isFolder ? '- ' : '  ';
      const parts = [title, metadata || '', description || ''];
      return indent + marker + parts.join(US);
    }

    function exportData() {
      const cells = document.querySelectorAll('cell-test');
      const centerCell = cells[40];
      const fileName = centerCell.data?.title || 'mandala';

      let output = '';

      for (let i = 0; i < 8; i++) {
        const [sg_row, sg_col] = LVL1_SG_POSITIONS[i];
        const lvl1Index = positionToIndex(1, 1, sg_row, sg_col);
        const lvl1Cell = cells[lvl1Index];

        if (!lvl1Cell.data) continue;

        // Export lvl1 folder
        output += formatLine('', true, lvl1Cell.data.title, lvl1Cell.data.metadata, lvl1Cell.data.description) + '\n';

        // Export lvl1 folder's drs as lvl1 files
        for (const dr of (lvl1Cell.data.drs || [])) {
          output += formatLine('', false, dr.title, dr.metadata, dr.description) + '\n';
        }

        // Get lvl2 items from corresponding maincell
        const [mg_row, mg_col] = LVL1_MG_POSITIONS[i];

        for (let j = 0; j < 8; j++) {
          const [sg2_row, sg2_col] = LVL2_SG_POSITIONS[j];
          const lvl2Index = positionToIndex(mg_row, mg_col, sg2_row, sg2_col);
          const lvl2Cell = cells[lvl2Index];

          if (!lvl2Cell.data) continue;

          // Export lvl2 folder
          output += formatLine('  ', true, lvl2Cell.data.title, lvl2Cell.data.metadata, lvl2Cell.data.description) + '\n';

          // Export lvl2 folder's drs as lvl2 files
          for (const dr of (lvl2Cell.data.drs || [])) {
            output += formatLine('  ', false, dr.title, dr.metadata, dr.description) + '\n';
          }
        }
      }

      // Download file
      const blob = new Blob([output], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${fileName}.md`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          parseAndImport(e.target.result, file.name);
          notify.show('Import successful');
        } catch (err) {
          notify.show(err.message);
        }
      };
      reader.readAsText(file);
    }

    function parseFields(level, isFolder, text) {
      const parts = text.split(US);
      return {
        level,
        isFolder,
        title: (parts[0] || '').trim(),
        metadata: (parts[1] || '').trim(),
        description: (parts[2] || '').trim()
      };
    }

    function parseLine(line) {
      // lvl1 folder: "- title"
      if (line.startsWith('- ')) {
        return parseFields(1, true, line.slice(2));
      }

      // lvl2 folder: "  - title" (2 spaces + "- ")
      if (line.startsWith('  - ')) {
        return parseFields(2, true, line.slice(4));
      }

      // lvl2 file: "    title" (4 spaces)
      if (line.startsWith('    ')) {
        return parseFields(2, false, line.slice(4));
      }

      // lvl1 file: "  title" (2 spaces, not "  - ")
      if (line.startsWith('  ')) {
        return parseFields(1, false, line.slice(2));
      }

      return null;
    }

    function parseAndImport(content, fileName) {
      const lines = content.split('\n');
      const cells = document.querySelectorAll('cell-test');

      // Clear all cells
      cells.forEach(cell => cell.setData(null));

      // Parse file name (remove extension)
      const name = fileName.replace(/\.(md|txt)$/, '');

      // Set center cell title
      cells[40].setData({ title: name, drs: [] });

      // Parsed structure
      let lvl1Folders = [];
      let currentLvl1Folder = null;
      let currentLvl2Folder = null;

      // Parse lines
      for (const line of lines) {
        if (!line.trim()) continue;

        const parsed = parseLine(line);
        if (!parsed || !parsed.title) continue;

        const { level, isFolder, title, metadata, description } = parsed;
        const record = { title, metadata, description, drs: [] };

        if (level === 1) {
          if (isFolder) {
            currentLvl1Folder = { ...record, children: [] };
            lvl1Folders.push(currentLvl1Folder);
            currentLvl2Folder = null;
          } else {
            // File at lvl1 - add to current lvl1 folder
            if (!currentLvl1Folder) {
              throw new Error(`Parse error: file "${title}" has no parent folder`);
            }
            currentLvl1Folder.drs.push({ title, metadata, description });
          }
        } else if (level === 2) {
          if (!currentLvl1Folder) {
            throw new Error(`Parse error: lvl2 item "${title}" has no parent lvl1 folder`);
          }
          if (isFolder) {
            currentLvl2Folder = record;
            currentLvl1Folder.children.push(currentLvl2Folder);
          } else {
            // File at lvl2 - add to current lvl2 folder
            if (!currentLvl2Folder) {
              throw new Error(`Parse error: file "${title}" has no parent folder`);
            }
            currentLvl2Folder.drs.push({ title, metadata, description });
          }
        }
      }

      // Validate counts
      if (lvl1Folders.length > 8) {
        throw new Error(`Parse error: too many lvl1 folders (${lvl1Folders.length}, max 8)`);
      }

      for (const folder of lvl1Folders) {
        if (folder.children.length > 8) {
          throw new Error(`Parse error: too many lvl2 folders for "${folder.title}" (${folder.children.length}, max 8)`);
        }
      }

      // Place lvl1 folders
      for (let i = 0; i < lvl1Folders.length; i++) {
        const folder = lvl1Folders[i];
        const [sg_row, sg_col] = LVL1_SG_POSITIONS[i];
        const [mg_row, mg_col] = LVL1_MG_POSITIONS[i];

        // Place in center maincell
        const centerIndex = positionToIndex(1, 1, sg_row, sg_col);
        cells[centerIndex].setData({
          title: folder.title,
          metadata: folder.metadata,
          description: folder.description,
          drs: folder.drs
        });

        // Duplicate in surrounding maincell center
        const dupIndex = positionToIndex(mg_row, mg_col, 1, 1);
        cells[dupIndex].setData({
          title: folder.title,
          metadata: folder.metadata,
          description: folder.description,
          drs: folder.drs
        });

        // Place lvl2 folders in surrounding maincell
        for (let j = 0; j < folder.children.length; j++) {
          const child = folder.children[j];
          const [sg2_row, sg2_col] = LVL2_SG_POSITIONS[j];
          const lvl2Index = positionToIndex(mg_row, mg_col, sg2_row, sg2_col);
          cells[lvl2Index].setData({
            title: child.title,
            metadata: child.metadata,
            description: child.description,
            drs: child.drs
          });
        }
      }

      saveToStorage();
    }

    // Jump key mappings (qwerty layout -> grid position)
    const JUMP_KEYS = {
      'w': [0, 0], 'e': [0, 1], 'r': [0, 2],
      's': [1, 0], 'd': [1, 1], 'f': [1, 2],
      'x': [2, 0], 'c': [2, 1], 'v': [2, 2],
      'W': [0, 0], 'E': [0, 1], 'R': [0, 2],
      'S': [1, 0], 'D': [1, 1], 'F': [1, 2],
      'X': [2, 0], 'C': [2, 1], 'V': [2, 2]
    };

    // Get focused cell element
    function getFocusedCell() {
      const focused = document.activeElement;
      if (focused?.tagName === 'CELL-TEST') {
        return focused;
      }
      return null;
    }

    // Document-level keyboard handler
    document.addEventListener('keydown', (e) => {
      // Skip if modal is open
      if (modal.isOpen) return;

      const cell = getFocusedCell();
      if (!cell) return;
      if (cell._isEditing) return;
      
      const index = parseInt(cell.dataset.index);
      const cells = Array.from(document.querySelectorAll('cell-test'));

      // Cell walk: hjkl
      if (e.key === 'h' || e.key === 'j' || e.key === 'k' || e.key === 'l') {
        e.preventDefault();
        const row = Math.floor(index / 9);
        const col = index % 9;
        let newRow = row, newCol = col;

        if (e.key === 'h') newCol = col - 1;
        if (e.key === 'l') newCol = col + 1;
        if (e.key === 'k') newRow = row - 1;
        if (e.key === 'j') newRow = row + 1;

        if (newRow >= 0 && newRow < 9 && newCol >= 0 && newCol < 9) {
          cells[newRow * 9 + newCol].focus();
        }
        return;
      }

      // Local jump: wersdfxcv (lowercase)
      if (JUMP_KEYS[e.key] && e.key === e.key.toLowerCase()) {
        e.preventDefault();
        const pos = indexToPosition(index);
        const [sg_row, sg_col] = JUMP_KEYS[e.key];
        const newIndex = positionToIndex(pos.mg_row, pos.mg_col, sg_row, sg_col);
        cells[newIndex].focus();
        return;
      }

      // Global jump: WERSDFXCV (uppercase)
      if (JUMP_KEYS[e.key] && e.key === e.key.toUpperCase() && e.key !== e.key.toLowerCase()) {
        e.preventDefault();
        const pos = indexToPosition(index);
        const [mg_row, mg_col] = JUMP_KEYS[e.key];
        const newIndex = positionToIndex(mg_row, mg_col, pos.sg_row, pos.sg_col);
        cells[newIndex].focus();
        return;
      }

      // Delegate other keys to cell
      cell.handleKeydown(e);
    });

    // Focus the center cell on load
    document.querySelectorAll('cell-test')[40].focus();
  </script>
</body>

</html>
