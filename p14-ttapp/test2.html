<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Timespan Editor — Component Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    body { padding: 20px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p.subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
    tt-timespan { position: fixed; width: 300px; left: 200px; top: 400px; }
  </style>
</head>
<body>

<h1>Timespan Editor — Component Test</h1>
<p class="subtitle">Tap start/end/duration to edit via dial. Use +/− buttons for quick duration adjust.</p>

<tt-timespan id="editor"></tt-timespan>

<script type="module">

import { TtDial } from './js/TtDial.js';
import { TtTimespan } from './js/TtTimespan.js';

customElements.define('tt-dial', TtDial);
customElements.define('tt-timespan', TtTimespan);

const editor = document.getElementById('editor');

// Seed with a 1-hour span starting at the top of the current hour
const now = new Date();
const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 0, 0);
editor.timespan = { startTime: start.getTime(), endTime: start.getTime() + 3600000 };

</script>
</body>
</html>
